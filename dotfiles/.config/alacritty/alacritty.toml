[terminal.shell]
program = "/etc/profiles/per-user/kmert/bin/nu"

[window]
opacity = 1.0
blur = true

[window.padding]
x = 12
y = 0

[font]
size = 13.0

[font.normal]
family = "Iosevka Nerd Font"

[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"


[cursor]
style = { shape = "Block", blinking = "On" }
unfocused_hollow = true

[keyboard]
bindings = [
   { key = "Return", mods = "Control|Shift", action = "SpawnNewInstance" }
]

[hints]

[[hints.enabled]]
command = "xdg-open"
regex = '(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>"\s{-}\^`\\]+'
hyperlinks = true
post_processing = true
persist = false
mouse = { enabled = true }
